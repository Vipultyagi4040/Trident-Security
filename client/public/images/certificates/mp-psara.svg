<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldPsara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Path -->
  <path d="M 100 12 Q 170 20 182 85 Q 182 145 100 190 Q 18 145 18 85 Q 30 20 100 12 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldPsara)" stroke-width="4"/>
  
  <path d="M 100 24 Q 158 30 168 85 Q 168 135 100 174 Q 32 135 32 85 Q 42 30 100 24 Z" 
        fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Star / Government Crown -->
  <circle cx="100" cy="46" r="6" fill="url(#goldPsara)"/>
  
  <!-- Central Badge Plate -->
  <rect x="36" y="60" width="128" height="42" rx="8" fill="#FFFFFF" stroke="url(#goldPsara)" stroke-width="1.5"/>
  <text x="100" y="82" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="950" fill="#0F172A" text-anchor="middle" letter-spacing="1">MP PSARA</text>
  <text x="100" y="96" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#2563EB" text-anchor="middle">LICENSED AGENCY</text>
  
  <!-- Govt Authority Subtext -->
  <text x="100" y="128" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#FDE047" text-anchor="middle" letter-spacing="0.5">GOVT. OF MP</text>
  <text x="100" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#93C5FD" text-anchor="middle">HOME DEPARTMENT</text>
  <text x="100" y="156" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="900" fill="#34D399" text-anchor="middle">ACT 2005 COMPLIANT</text>
</svg>
